version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: everest_textile_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: everest_textile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d everest_textile_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: everest_textile_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/everest_textile_db
      - SECRET_KEY=everest_production_secret_key_change_me_in_real_prod
      - ENVIRONMENT=development
      - DEBUG=true
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:8080","http://127.0.0.1:5173"]
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
